name: Guard generated files

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
    # Never create a run for a release-please PR. The job-level author exemption
    # below cannot do this: it is evaluated inside a run, and a GITHUB_TOKEN PR's
    # run is created in action_required and never starts.
    paths-ignore:
      - .release-please-manifest.json
      - CHANGELOG.md

permissions:
  contents: read

concurrency:
  group: guard-generated-files-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Generated files must not be hand-edited
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Release automation retains its existing exemption. Other PRs may only
    # import the complete, byte-identical metadata of the pinned upstream tag.
    if: >-
      github.event.pull_request.user.login != 'github-actions[bot]' &&
      github.event.pull_request.user.login != 'release-please[bot]'
    steps:
      - uses: actions/checkout@v6
        with:
          # Need history on both sides of the merge-base so `git diff base...head`
          # reflects exactly what GitHub shows as "Files changed".
          fetch-depth: 0

      - name: Check generated files are untouched or an exact upstream import
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          files=$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}" --no-renames)

          violated=""
          for path in CHANGELOG.md .release-please-manifest.json; do
            if printf '%s\n' "$files" | grep -qxF -- "$path"; then
              violated="${violated} ${path}"
            fi
          done

          if [ -n "$violated" ]; then
            # Read the pin and artifacts from the event head, not checkout's
            # synthetic merge commit or a mutable working tree. Never source it.
            upstream_tag=$(git show "${HEAD_SHA}:.github/upstream-release-tag")
            if ! [[ "$upstream_tag" =~ ^v[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
              echo "::error::Invalid upstream release tag pin" >&2
              exit 1
            fi

            # A fork can have a same-named tag. Only a fresh fetch from the
            # canonical upstream supplies authority; a failed fetch is fatal,
            # even if this private ref was populated by an earlier invocation.
            upstream_ref=refs/no-mistakes/generated-release
            git fetch --no-tags --depth=1 --force https://github.com/kunchenguid/no-mistakes.git \
              "refs/tags/${upstream_tag}:${upstream_ref}"
            upstream_commit=$(git rev-parse --verify "${upstream_ref}^{commit}")

            matches=true
            for path in CHANGELOG.md .release-please-manifest.json; do
              expected=$(git ls-tree "$upstream_commit" -- "$path")
              actual=$(git ls-tree "$HEAD_SHA" -- "$path")
              # Equal tree entries prove both blob bytes and file mode. Check
              # EVERY artifact, including any unchanged relative to the base.
              if [ -z "$expected" ] || [ "$actual" != "$expected" ]; then
                matches=false
              fi
            done
            if [ "$matches" = true ]; then
              echo "Complete upstream ${upstream_tag} release metadata imported unchanged. OK."
              exit 0
            fi

            {
              echo "::error::This PR modifies release-please-generated files:${violated}"
              echo
              echo "CHANGELOG.md and .release-please-manifest.json are auto-generated by"
              echo "release-please from conventional commits on main. Do not hand-edit them."
              echo "An upstream import must match EVERY artifact in ${upstream_tag} exactly."
              echo
              echo "If you want your change to appear in the next release notes, use a"
              echo "conventional commit message (feat/fix/docs/...). release-please will"
              echo "update these files in the next release PR automatically."
              echo
              echo "See CONTRIBUTING.md for the full contributor workflow."
            } >&2
            exit 1
          fi

          echo "No release-please-generated files modified. OK."
